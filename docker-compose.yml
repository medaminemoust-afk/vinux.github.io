# Portainer stack for Vinux.
#
# Required stack environment variables:
#   GITHUB_REPOSITORY=medaminemoust-afk/vinux.github.io
#
# Watchtower closes the loop: pushing to main publishes a new :latest, Watchtower
# sees the digest change and redeploys by itself.
#
# No database here. Search, radios, playback, lyrics and offline downloads need
# none — downloads live in the browser's IndexedDB. Only favorites and playlists
# do, and without DATABASE_URL those two routes answer 500: the tabs stay empty
# and the heart button does not stick. To turn them on, add a postgres service
# and set DATABASE_URL below.
#
# No `version:` key — Compose V2 ignores it and warns that it is obsolete.

services:
  vinux:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: vinux
    ports:
      # Only the host side is configurable; 3000 inside the container is on its
      # own network and clashes with nothing. Override APP_PORT if 3030 is taken.
      - "${APP_PORT:-3030}:3000"
    environment:
      - PORT=3000
      # - DATABASE_URL=postgres://user:password@host:5432/vinux
      # Access log: both must be set for it to record anything.
      - ACCESS_LOG_ENABLED=${ACCESS_LOG_ENABLED:-0}
      - ACCESS_LOG_PATH=/data/access.log
      # 32+ random chars, e.g. `openssl rand -hex 24`. Unset = endpoint 404s.
      - ACCESS_LOG_TOKEN=${ACCESS_LOG_TOKEN:-}
    volumes:
      # Named volume, so the log survives the redeploys Watchtower triggers.
      - vinux-data:/data
    restart: unless-stopped
    networks:
      - vinux-network
    healthcheck:
      # Uses node rather than wget/curl: the runtime image is node:bookworm-slim,
      # which ships neither.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  vinux-network:
    driver: bridge

volumes:
  vinux-data:
